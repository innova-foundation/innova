version: 2.1
executors:
  cpp-build:
    docker:
      - image: cimg/base:2024.01
    resource_class: large
    environment:
      MAKEFLAGS: "-j 4"
jobs:
  build:
    executor: cpp-build
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update -y
            sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
              libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb++-dev \
              libminiupnpc-dev libqrencode-dev libcurl4-openssl-dev libgmp-dev \
              libsecp256k1-dev libprotobuf-dev protobuf-compiler \
              qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools \
              qt6-l10n-tools libgl1-mesa-dev
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Restore vendored crates
          command: |
            # vendor/ is not in git; cargo vendor restores it from the checksums in Cargo.lock.
            cd src/privacy_vnext/rust
            CARGO_NET_OFFLINE=false cargo vendor --locked --versioned-dirs --sync upstream/Cargo.toml > /dev/null
      - run:
          name: innovad build
          command: |
            cd src
            make -f makefile.unix USE_NATIVETOR=- innovad
      - run:
          name: Innova Qt build
          command: |
            /usr/lib/qt6/bin/qmake USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- innova-qt.pro
            make
workflows:
  build-deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - master
                - dev

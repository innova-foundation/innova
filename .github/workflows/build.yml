name: Build & Release Innova

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to bump: major (A), minor (B), patch (C) or build (D)'
        required: false
        type: choice
        options: [build, patch, minor, major]
        default: build
      publish_release:
        description: 'Tag and publish a GitHub release after the full matrix passes'
        required: false
        type: boolean
        default: false
      replace_existing_release:
        description: 'To REPLACE an existing published release, type its exact tag (e.g. v5.0.0.0). Leave blank otherwise.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COIN_NAME: innova

jobs:
  # ─────────────────────────────────────────────────────────
  # Version detection
  # ─────────────────────────────────────────────────────────
  get-version:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine version; on release, stamp, commit and tag it
        id: version
        env:
          EVENT: ${{ github.event_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
          DEFAULT_BUMP: ${{ vars.DEFAULT_RELEASE_BUMP || 'build' }}
        run: contrib/versioning/next-version.sh

  # ─────────────────────────────────────────────────────────
  # Ubuntu 22.04 x86_64 (daemon + Qt)
  # ─────────────────────────────────────────────────────────
  build-ubuntu-2204:
    runs-on: ubuntu-22.04
    needs: get-version
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb++-dev \
            libminiupnpc-dev libqrencode-dev libcurl4-openssl-dev libgmp-dev \
            libsecp256k1-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev \
            libprotobuf-dev protobuf-compiler

      - name: Build daemon
        run: |
          cd src
          make USE_NATIVETOR=- -f makefile.unix -j$(nproc)

      - name: Build Qt wallet
        run: |
          sed -i 's/LIBS += -lcurl -lssl -lcrypto -lcrypt32 -lssh2 -lgcrypt -lidn2 -lgpg-error -lunistring -lwldap32 -ldb_cxx$$BDB_LIB_SUFFIX/LIBS += -lcurl -lssl -lcrypto -ldb_cxx$$BDB_LIB_SUFFIX/' innova-qt.pro
          sudo strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5 || true
          qmake6 USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- innova-qt.pro
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p innova-${{ needs.get-version.outputs.version }}-ubuntu2204-x86_64
          cp src/innovad Innova innova-${{ needs.get-version.outputs.version }}-ubuntu2204-x86_64/
          strip innova-${{ needs.get-version.outputs.version }}-ubuntu2204-x86_64/*
          cd innova-${{ needs.get-version.outputs.version }}-ubuntu2204-x86_64
          sha256sum * > SHA256SUMS.txt
          cd ..
          tar -czf innova-${{ needs.get-version.outputs.version }}-ubuntu2204-x86_64.tar.gz \
            innova-${{ needs.get-version.outputs.version }}-ubuntu2204-x86_64/

      - uses: actions/upload-artifact@v6
        with:
          name: innova-ubuntu2204-x86_64
          path: innova-${{ needs.get-version.outputs.version }}-ubuntu2204-x86_64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Ubuntu 24.04 x86_64 (daemon + Qt)
  # ─────────────────────────────────────────────────────────
  build-ubuntu-2404:
    runs-on: ubuntu-24.04
    needs: get-version
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb++-dev \
            libminiupnpc-dev libqrencode-dev libcurl4-openssl-dev libgmp-dev \
            libsecp256k1-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libgl1-mesa-dev \
            libprotobuf-dev protobuf-compiler

      - name: Build daemon
        run: |
          cd src
          make USE_NATIVETOR=- -f makefile.unix -j$(nproc)

      - name: Build Qt wallet
        run: |
          sed -i 's/LIBS += -lcurl -lssl -lcrypto -lcrypt32 -lssh2 -lgcrypt -lidn2 -lgpg-error -lunistring -lwldap32 -ldb_cxx$$BDB_LIB_SUFFIX/LIBS += -lcurl -lssl -lcrypto -ldb_cxx$$BDB_LIB_SUFFIX/' innova-qt.pro
          sudo strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5 || true
          qmake6 USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- innova-qt.pro
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p innova-${{ needs.get-version.outputs.version }}-ubuntu2404-x86_64
          cp src/innovad Innova innova-${{ needs.get-version.outputs.version }}-ubuntu2404-x86_64/
          strip innova-${{ needs.get-version.outputs.version }}-ubuntu2404-x86_64/*
          cd innova-${{ needs.get-version.outputs.version }}-ubuntu2404-x86_64
          sha256sum * > SHA256SUMS.txt
          cd ..
          tar -czf innova-${{ needs.get-version.outputs.version }}-ubuntu2404-x86_64.tar.gz \
            innova-${{ needs.get-version.outputs.version }}-ubuntu2404-x86_64/

      - uses: actions/upload-artifact@v6
        with:
          name: innova-ubuntu2404-x86_64
          path: innova-${{ needs.get-version.outputs.version }}-ubuntu2404-x86_64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Ubuntu 26.04 x86_64 (daemon + Qt) via Docker container
  # ─────────────────────────────────────────────────────────
  build-ubuntu-2604:
    runs-on: ubuntu-22.04
    needs: get-version
    container:
      image: ubuntu:26.04
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates git curl

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository -y universe || true
          apt-get update
          apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev bsdextrautils libboost-all-dev libdb5.3++-dev \
            libminiupnpc-dev libqrencode-dev libcurl4-openssl-dev libgmp-dev \
            libsecp256k1-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libgl1-mesa-dev \
            libprotobuf-dev protobuf-compiler

      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust

      - name: Configure Berkeley DB paths
        run: |
          set -eu
          bdb_header="$(find /usr/include -name db_cxx.h -print -quit)"
          bdb_lib="$(find /usr/lib -name libdb_cxx.so -print -quit)"
          if [ -z "$bdb_lib" ]; then
            bdb_lib="$(find /usr/lib -name 'libdb_cxx*.so' -print -quit)"
          fi
          if [ -z "$bdb_lib" ]; then
            bdb_lib="$(find /usr/lib -name 'libdb_cxx*.a' -print -quit)"
          fi
          if [ -z "$bdb_header" ] || [ -z "$bdb_lib" ]; then
            echo "Unable to locate Berkeley DB C++ headers/libs"
            exit 1
          fi

          bdb_suffix="$(basename "$bdb_lib")"
          bdb_suffix="${bdb_suffix#libdb_cxx}"
          bdb_suffix="${bdb_suffix%.so}"
          bdb_suffix="${bdb_suffix%.a}"

          echo "BDB_INCLUDE_PATH=$(dirname "$bdb_header")" >> "$GITHUB_ENV"
          echo "BDB_LIB_PATH=$(dirname "$bdb_lib")" >> "$GITHUB_ENV"
          echo "BDB_LIB_SUFFIX=$bdb_suffix" >> "$GITHUB_ENV"

      - name: Build daemon
        run: |
          cd src
          make USE_NATIVETOR=- BDB_INCLUDE_PATH="$BDB_INCLUDE_PATH" BDB_LIB_PATH="$BDB_LIB_PATH" BDB_LIB_SUFFIX="$BDB_LIB_SUFFIX" -f makefile.unix -j$(nproc)

      - name: Build Qt wallet
        run: |
          sed -i 's/LIBS += -lcurl -lssl -lcrypto -lcrypt32 -lssh2 -lgcrypt -lidn2 -lgpg-error -lunistring -lwldap32 -ldb_cxx$$BDB_LIB_SUFFIX/LIBS += -lcurl -lssl -lcrypto -ldb_cxx$$BDB_LIB_SUFFIX/' innova-qt.pro
          strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5 || true
          qmake6 USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- BDB_INCLUDE_PATH="$BDB_INCLUDE_PATH" BDB_LIB_PATH="$BDB_LIB_PATH" BDB_LIB_SUFFIX="$BDB_LIB_SUFFIX" innova-qt.pro
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p innova-${{ needs.get-version.outputs.version }}-ubuntu2604-x86_64
          cp src/innovad Innova innova-${{ needs.get-version.outputs.version }}-ubuntu2604-x86_64/
          strip innova-${{ needs.get-version.outputs.version }}-ubuntu2604-x86_64/*
          cd innova-${{ needs.get-version.outputs.version }}-ubuntu2604-x86_64
          sha256sum * > SHA256SUMS.txt
          cd ..
          tar -czf innova-${{ needs.get-version.outputs.version }}-ubuntu2604-x86_64.tar.gz \
            innova-${{ needs.get-version.outputs.version }}-ubuntu2604-x86_64/

      - uses: actions/upload-artifact@v6
        with:
          name: innova-ubuntu2604-x86_64
          path: innova-${{ needs.get-version.outputs.version }}-ubuntu2604-x86_64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Debian 12 x86_64 (daemon + Qt) via Docker container
  # ─────────────────────────────────────────────────────────
  build-debian-12:
    runs-on: ubuntu-22.04
    needs: get-version
    container:
      image: debian:12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb++-dev \
            libminiupnpc-dev libqrencode-dev libcurl4-openssl-dev libgmp-dev \
            libsecp256k1-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libgl1-mesa-dev \
            libprotobuf-dev protobuf-compiler \
            git curl ca-certificates

      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust

      - name: Build daemon
        run: |
          cd src
          make USE_NATIVETOR=- -f makefile.unix -j$(nproc)

      - name: Build Qt wallet
        run: |
          sed -i 's/LIBS += -lcurl -lssl -lcrypto -lcrypt32 -lssh2 -lgcrypt -lidn2 -lgpg-error -lunistring -lwldap32 -ldb_cxx$$BDB_LIB_SUFFIX/LIBS += -lcurl -lssl -lcrypto -ldb_cxx$$BDB_LIB_SUFFIX/' innova-qt.pro
          strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5 || true
          qmake6 USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- innova-qt.pro
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p innova-${{ needs.get-version.outputs.version }}-debian12-x86_64
          cp src/innovad Innova innova-${{ needs.get-version.outputs.version }}-debian12-x86_64/
          strip innova-${{ needs.get-version.outputs.version }}-debian12-x86_64/*
          cd innova-${{ needs.get-version.outputs.version }}-debian12-x86_64
          sha256sum * > SHA256SUMS.txt
          cd ..
          tar -czf innova-${{ needs.get-version.outputs.version }}-debian12-x86_64.tar.gz \
            innova-${{ needs.get-version.outputs.version }}-debian12-x86_64/

      - uses: actions/upload-artifact@v6
        with:
          name: innova-debian12-x86_64
          path: innova-${{ needs.get-version.outputs.version }}-debian12-x86_64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Linux aarch64 (daemon only)
  # ─────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    needs: get-version
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb++-dev \
            libminiupnpc-dev libqrencode-dev libcurl4-openssl-dev libgmp-dev \
            libsecp256k1-dev

      - name: Build daemon
        run: |
          cd src
          make USE_NATIVETOR=- -f makefile.arm -j$(nproc)

      - name: Package
        run: |
          mkdir -p innova-${{ needs.get-version.outputs.version }}-linux-aarch64
          cp src/innovad innova-${{ needs.get-version.outputs.version }}-linux-aarch64/
          strip innova-${{ needs.get-version.outputs.version }}-linux-aarch64/innovad || true
          cd innova-${{ needs.get-version.outputs.version }}-linux-aarch64
          sha256sum * > SHA256SUMS.txt
          cd ..
          tar -czf innova-${{ needs.get-version.outputs.version }}-linux-aarch64.tar.gz \
            innova-${{ needs.get-version.outputs.version }}-linux-aarch64/

      - uses: actions/upload-artifact@v6
        with:
          name: innova-linux-aarch64
          path: innova-${{ needs.get-version.outputs.version }}-linux-aarch64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # macOS ARM64 (Apple Silicon) — daemon + Qt
  # ─────────────────────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-14
    needs: get-version
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust
      - name: Install dependencies
        run: |
          brew install boost openssl@3 berkeley-db@5 miniupnpc libevent qt@5 qrencode \
            curl gmp secp256k1

      - name: Build daemon
        run: |
          cd src
          make STRICT_WARNINGS=1 -f makefile.osx clean
          make STRICT_WARNINGS=1 -f makefile.osx -j$(sysctl -n hw.ncpu) innovad test_innova

      - name: Full macOS 38-translation-unit test aggregate
        run: |
          cd src
          make STRICT_WARNINGS=1 -f makefile.osx release-check

      - name: Build Qt wallet
        run: |
          /opt/homebrew/opt/qt@5/bin/qmake USE_UPNP=1 USE_QRCODE=1 innova-qt.pro
          make -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          set -euo pipefail
          strip src/innovad || true
          test -s src/innovad
          mkdir -p dmg_contents
          cp src/innovad dmg_contents/
          if [ -d "Innova.app" ]; then
            strip Innova.app/Contents/MacOS/Innova || true
            test -s Innova.app/Contents/MacOS/Innova
            cp -R Innova.app dmg_contents/
          elif [ -f "Innova" ]; then
            strip Innova || true
            test -s Innova
            cp Innova dmg_contents/
          else
            echo "Qt wallet output is missing" >&2
            exit 1
          fi
          (
            cd dmg_contents
            find . -type f ! -name SHA256SUMS.txt -exec shasum -a 256 {} \; > SHA256SUMS.txt
            test -s SHA256SUMS.txt
          )
          touch dmg_contents/.metadata_never_index
          dmg="innova-${{ needs.get-version.outputs.version }}-macOS-arm64.dmg"
          created=0
          for attempt in 1 2 3; do
            hdiutil create -volname "Innova" -srcfolder dmg_contents \
              -ov -format UDZO "$dmg" && { created=1; break; }
            echo "hdiutil attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          if [ "$created" -ne 1 ] || [ ! -s "$dmg" ]; then
            echo "failed to create required macOS DMG" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: innova-macOS-arm64
          path: innova-${{ needs.get-version.outputs.version }}-macOS-arm64.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Windows x86_64 — fully static daemon + Qt via MSYS2
  # ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: get-version
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-db
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-libevent
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-graphite2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-jbigkit
            mingw-w64-ucrt-x86_64-lerc
            mingw-w64-ucrt-x86_64-libdeflate
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-protobuf
            make
            git


      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust
      - name: Build LevelDB
        run: |
          cd src/leveldb
          TARGET_OS=NATIVE_WINDOWS make libleveldb.a libmemenv.a -j$(nproc)

      - name: Detect library suffixes
        id: libs
        run: |
          echo "=== Available boost libraries (sample) ==="
          ls /ucrt64/lib/libboost_system* 2>/dev/null || echo "  boost_system: (none - header-only)"
          ls /ucrt64/lib/libboost_filesystem* 2>/dev/null || echo "  boost_filesystem: (none found)"
          ls /ucrt64/lib/libboost_thread* 2>/dev/null || echo "  boost_thread: (none found)"
          echo "=== Available BDB libraries ==="
          ls /ucrt64/lib/libdb_cxx* 2>/dev/null || echo "  (none found)"
          echo ""

          # Detect boost suffix from boost_filesystem (boost_system is header-only since 1.69)
          BOOST_LIB=$(find /ucrt64/lib -maxdepth 1 -name "libboost_filesystem*.dll.a" -print -quit 2>/dev/null)
          if [ -z "$BOOST_LIB" ]; then
            BOOST_LIB=$(find /ucrt64/lib -maxdepth 1 -name "libboost_filesystem*.a" -print -quit 2>/dev/null)
          fi
          if [ -n "$BOOST_LIB" ]; then
            BOOST_SUFFIX=$(basename "$BOOST_LIB" | sed 's/^libboost_filesystem//; s/\.dll\.a$//; s/\.a$//')
            echo "Detected boost suffix: '$BOOST_SUFFIX'"
          else
            BOOST_SUFFIX="-mt"
            echo "WARNING: No boost_filesystem library found, using default '$BOOST_SUFFIX'"
          fi
          echo "boost_suffix=$BOOST_SUFFIX" >> "$GITHUB_OUTPUT"

          # Detect BDB suffix
          BDB_LIB=$(find /ucrt64/lib -maxdepth 1 -name "libdb_cxx*.dll.a" -print -quit 2>/dev/null)
          if [ -z "$BDB_LIB" ]; then
            BDB_LIB=$(find /ucrt64/lib -maxdepth 1 -name "libdb_cxx*.a" -print -quit 2>/dev/null)
          fi
          if [ -n "$BDB_LIB" ]; then
            BDB_SUFFIX=$(basename "$BDB_LIB" | sed 's/^libdb_cxx//; s/\.dll\.a$//; s/\.a$//')
            echo "Detected BDB suffix: '$BDB_SUFFIX'"
          else
            BDB_SUFFIX=""
            echo "WARNING: No db_cxx library found, using no suffix"
          fi
          echo "bdb_suffix=$BDB_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Build daemon (fully static)
        run: |
          # MSYS2 does not inherit the Windows PATH; the Rust step built the GNU target.
          export PATH="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin:$PATH"
          export CARGO_BUILD_TARGET=x86_64-pc-windows-gnu
          cd src
          make -f makefile.mingw \
            BOOST_ROOT=/ucrt64 \
            BDB_ROOT=/ucrt64 \
            OPENSSL_ROOT=/ucrt64 \
            LIBEVENT_ROOT=/ucrt64 \
            CURL_ROOT=/ucrt64 \
            MINIUPNPC_ROOT=/ucrt64 \
            BOOST_LIB_SUFFIX="${{ steps.libs.outputs.boost_suffix }}" \
            BDB_LIB_SUFFIX="${{ steps.libs.outputs.bdb_suffix }}" \
            STATIC=1 \
            LDFLAGS="-static -Wl,--dynamicbase -Wl,--nxcompat -Wl,--high-entropy-va" \
            USE_NATIVETOR=- \
            USE_IPFS=1 \
            INNOVA_SPINNER=0 \
            -j$(nproc)

      - name: Build Qt wallet (fully static)
        run: |
          export PATH="$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin:$PATH"
          export CARGO_BUILD_TARGET=x86_64-pc-windows-gnu
          /ucrt64/qt6-static/bin/qmake \
            "BOOST_LIB_SUFFIX=${{ steps.libs.outputs.boost_suffix }}" \
            "BOOST_THREAD_LIB_SUFFIX=${{ steps.libs.outputs.boost_suffix }}" \
            "BDB_LIB_SUFFIX=${{ steps.libs.outputs.bdb_suffix }}" \
            "STATIC_LINK=1" \
            "USE_UPNP=1" \
            "USE_NATIVETOR=-" \
            innova-qt.pro
          make -j$(nproc)

      - name: Package
        run: |
          set -euo pipefail
          PKGDIR="innova-${{ needs.get-version.outputs.version }}-win64"
          mkdir -p "$PKGDIR"
          cp src/innovad.exe "$PKGDIR/"
          if [ -s release/Innova.exe ]; then
            cp release/Innova.exe "$PKGDIR/"
          elif [ -s Innova.exe ]; then
            cp Innova.exe "$PKGDIR/"
          else
            echo "Qt wallet output is missing" >&2
            exit 1
          fi
          test -s "$PKGDIR/innovad.exe"
          test -s "$PKGDIR/Innova.exe"
          strip "$PKGDIR"/*.exe 2>/dev/null || true
          cd "$PKGDIR"
          sha256sum *.exe > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cd ..
          "/c/Program Files/7-Zip/7z.exe" a innova-${{ needs.get-version.outputs.version }}-win64.zip "$PKGDIR"/*
          test -s innova-${{ needs.get-version.outputs.version }}-win64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: innova-win64
          path: innova-${{ needs.get-version.outputs.version }}-win64.zip
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Debian 11 (Bullseye) x86_64 (daemon + Qt) via Docker
  # ─────────────────────────────────────────────────────────
  build-debian-11:
    runs-on: ubuntu-22.04
    needs: get-version
    container:
      # A dated 11.11 image: its base libraries match the point release, so it
      # installs from deb.debian.org without the pruned bullseye-security pool.
      image: debian:bullseye-20240926
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - name: Configure apt
        run: |
          echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80retries
          # deb.debian.org's bullseye-security index names files its pool no longer
          # holds (LTS ended); build from the 11.11 point release instead.
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          # Once bullseye leaves deb.debian.org, fall back to archive.debian.org.
          if ! apt-get update --error-on=any; then
            sed -i 's|http://deb.debian.org|http://archive.debian.org|' /etc/apt/sources.list
            echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive
            apt-get update --error-on=any
          fi

      - name: Install dependencies
        run: |
          apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb++-dev \
            libminiupnpc-dev libqrencode-dev libcurl4-openssl-dev libgmp-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools libgl1-mesa-dev \
            libprotobuf-dev protobuf-compiler git \
            curl ca-certificates

      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust

      - name: Build daemon
        run: |
          cd src
          make USE_NATIVETOR=- -f makefile.unix -j$(nproc)

      - name: Build Qt wallet
        run: |
          sed -i 's/LIBS += -lcurl -lssl -lcrypto -lcrypt32 -lssh2 -lgcrypt -lidn2 -lgpg-error -lunistring -lwldap32 -ldb_cxx$$BDB_LIB_SUFFIX/LIBS += -lcurl -lssl -lcrypto -ldb_cxx$$BDB_LIB_SUFFIX/' innova-qt.pro
          /usr/lib/x86_64-linux-gnu/qt5/bin/qmake USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- innova-qt.pro
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p innova-${{ needs.get-version.outputs.version }}-debian11-x86_64
          cp src/innovad Innova innova-${{ needs.get-version.outputs.version }}-debian11-x86_64/
          strip innova-${{ needs.get-version.outputs.version }}-debian11-x86_64/*
          cd innova-${{ needs.get-version.outputs.version }}-debian11-x86_64
          sha256sum * > SHA256SUMS.txt
          cd ..
          tar -czf innova-${{ needs.get-version.outputs.version }}-debian11-x86_64.tar.gz \
            innova-${{ needs.get-version.outputs.version }}-debian11-x86_64/

      - uses: actions/upload-artifact@v6
        with:
          name: innova-debian11-x86_64
          path: innova-${{ needs.get-version.outputs.version }}-debian11-x86_64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Fedora 41 x86_64 (daemon + Qt) via Docker

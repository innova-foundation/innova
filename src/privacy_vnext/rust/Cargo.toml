[package]
name = "innova-privacy-vnext"
version = "0.0.0"
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MIT"
description = "Fail-closed Innova IV5 consensus ABI"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
blake2 = { version = "0.10.6", default-features = false }
ciphersuite = { version = "0.4", default-features = false, features = ["std"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
dalek-ff-group = { version = "0.5", default-features = false }
ec-divisors = { path = "upstream/crypto/divisors", default-features = false, features = ["ed25519"] }
generalized-bulletproofs = { path = "upstream/crypto/generalized-bulletproofs", default-features = false, features = ["std"] }
helioselene = { path = "upstream/crypto/helioselene", default-features = false, features = ["alloc", "std"] }
monero-ed25519 = { path = "upstream/monero-oxide/ed25519", default-features = false, features = ["std"] }
monero-bulletproofs = { path = "upstream/monero-oxide/ringct/bulletproofs", default-features = false, features = ["std", "compile-time-generators"] }
monero-fcmp-plus-plus = { path = "upstream/monero-oxide/ringct/fcmp++", default-features = false, features = ["std", "compile-time-generators"] }
monero-fcmp-plus-plus-generators = { path = "upstream/monero-oxide/ringct/fcmp++/generators", default-features = false, features = ["std"] }
monero-primitives = { path = "upstream/monero-oxide/primitives", default-features = false, features = ["std"] }
multiexp = { version = "0.4.2", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "1.8.2", default-features = false }

[profile.dev]
panic = "unwind"
overflow-checks = true

[profile.release]
panic = "unwind"
overflow-checks = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

          cp src/innovad Innova innova-${{ needs.get-version.outputs.version }}-archlinux-x86_64/
          strip innova-${{ needs.get-version.outputs.version }}-archlinux-x86_64/*
          cd innova-${{ needs.get-version.outputs.version }}-archlinux-x86_64

  # ─────────────────────────────────────────────────────────
  # Fedora 40 x86_64 (daemon + Qt) via Docker
  # ─────────────────────────────────────────────────────────
  build-fedora-40:
    runs-on: ubuntu-22.04
    needs: get-version
    container:
      image: fedora:40
    steps:
      - uses: actions/checkout@v5
        with:

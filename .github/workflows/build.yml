            miniupnpc-devel qrencode-devel libcurl-devel gmp-devel zlib-devel \
            qt5-qtbase-devel qt5-qttools-devel \
            protobuf-devel protobuf-compiler git

      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust

      - name: Build daemon
        run: |
          cd src
          make USE_NATIVETOR=- -f makefile.unix -j$(nproc)

      - name: Build Qt wallet
        run: |
          sed -i 's/LIBS += -lcurl -lssl -lcrypto -lcrypt32 -lssh2 -lgcrypt -lidn2 -lgpg-error -lunistring -lwldap32 -ldb_cxx$$BDB_LIB_SUFFIX/LIBS += -lcurl -lssl -lcrypto -ldb_cxx$$BDB_LIB_SUFFIX/' innova-qt.pro
          qmake-qt5 USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- innova-qt.pro
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p innova-${{ needs.get-version.outputs.version }}-fedora40-x86_64
          cp src/innovad Innova innova-${{ needs.get-version.outputs.version }}-fedora40-x86_64/
          strip innova-${{ needs.get-version.outputs.version }}-fedora40-x86_64/*

# Innova snap: innovad and the Qt6 wallet (v5), amd64 and arm64.
# https://innova-foundation.com
# https://github.com/innova-foundation/innova
# By Carsen Klock - Edited by CircuitBreaker
name: innova
version: '5.0.0.1'
summary: Innova
description: |
  An open source hybrid cryptocurrency called Innova, which features Collateral Nodes (Masternodes), Staking, Mining, Multisig, and much more!

grade: stable
confinement: strict
base: core22

architectures:
  - build-on: amd64
  - build-on: arm64

plugs: # plugs for theming, font settings, cursor and to use gtk3 file chooser
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes:gtk-3-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes:icon-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes:sounds-themes

apps:
  innovad:
    command: bin/innovad
    plugs: [home, network, network-bind]
    daemon: forking
  daemon:
    command: bin/innovad
    plugs: [home, network, network-bind]
    environment:
      XDG_DATA_DIRS: $SNAP_USER_DATA:/var/lib/snapd/desktop:$XDG_DATA_DIRS
      # Override HOME so the datadir is located at
      # ~/snap/innova/common/.innova/ instead of
      # ~/snap/innova/current/.innova/, and each new version of the
      # snap won't have a different data directory:
      # https://docs.snapcraft.io/environment-variables/7983
      HOME: $SNAP_USER_COMMON
  innova:
    command: bin/Innova
    plugs: [home, network, network-bind, unity7, wayland, desktop-legacy, desktop, x11, gsettings]
    desktop: innova.desktop
    environment:
      QT_QPA_PLATFORMTHEME: gtk3
      XDG_DATA_DIRS: $SNAP_USER_DATA:/var/lib/snapd/desktop:$XDG_DATA_DIRS
      HOME: $SNAP_USER_COMMON

parts:
  innova:
    source: .
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
      - git
      - build-essential
      - pkg-config
      - zlib1g-dev
      - libssl-dev
      - libevent-dev
      - libboost-all-dev
      - libdb++-dev
      - libminiupnpc-dev
      - libqrencode-dev
      - libcurl4-openssl-dev
      - libgmp-dev
      - libsecp256k1-dev
      - libminizip-dev
      - libprotobuf-dev
      - protobuf-compiler
      - qt6-base-dev
      - qt6-base-dev-tools
      - qt6-tools-dev
      - qt6-tools-dev-tools
      - qt6-l10n-tools
      - libgl1-mesa-dev
    stage-packages:
      - libdb5.3++
      - libboost-system1.74.0
      - libboost-filesystem1.74.0
      - libboost-program-options1.74.0
      - libboost-thread1.74.0
      - libboost-chrono1.74.0
      - libqrencode4
      - libminiupnpc17
      - libcurl4
      - libssl3
      - libgmp10
      - libqt6core6
      - libqt6gui6
      - libqt6widgets6
      - libqt6network6
      - libqt6dbus6
      - libqt6printsupport6
      - libqt6svg6
      - qt6-qpa-plugins
      - qt6-wayland
      - qt6-gtk-platformtheme
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb-cursor0
    override-build: |
      set -ex
      # vendor/ is not in git; restore it from the checksums pinned in Cargo.lock.
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      export PATH="$HOME/.cargo/bin:$PATH"
      (cd src/privacy_vnext/rust && CARGO_NET_OFFLINE=false cargo vendor --locked --versioned-dirs --sync upstream/Cargo.toml > /dev/null)
      make -C src -f makefile.unix -j"$(nproc)" USE_NATIVETOR=- innovad
      /usr/lib/qt6/bin/qmake USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- innova-qt.pro
      make -j"$(nproc)"
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      cp src/innovad Innova "$SNAPCRAFT_PART_INSTALL/bin/"
  desktop:
    source: snap/gui
    plugin: dump
  hooks:
    plugin: dump
    source: hooks/
    organize:
      bin/: snap/hooks/

hooks:
  install:
    plugs: [network, network-bind]
  post-refresh:
    plugs: [network, network-bind]
  configure:
    plugs: [network, network-bind]

name: Setup IV5 Rust layer
description: >-
  Install the pinned Rust toolchain and restore the vendored crates the IV5
  privacy layer needs. Every daemon and Qt build links libinnova_privacy_vnext.a,
  so this must run before any build step.

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        # rust-toolchain.toml pins the version; installing it here keeps the
        # first cargo invocation from doing it mid-build.
        cd src/privacy_vnext/rust
        rustup show active-toolchain || rustup toolchain install
        # makefile.mingw and the .pro both link libinnova_privacy_vnext.a, the
        # GNU-style archive. rustup defaults to the MSVC host on Windows, which
        # emits innova_privacy_vnext.lib instead, so pull in the GNU target there.
        case "${RUNNER_OS:-}" in
          Windows) rustup target add x86_64-pc-windows-gnu ;;
        esac

    - name: Restore vendored crates
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        cd src/privacy_vnext/rust
        # vendor/ is not tracked in git. cargo vendor reproduces it from the
        # versions and SHA-256 checksums pinned in Cargo.lock, so the build stays
        # offline and reproducible after this one networked step.
        #
        # .cargo/config.toml replaces crates-io with the vendor directory and
        # sets offline mode, so cargo vendor cannot run while it is in place: it
        # would be told to resolve from the directory it is supposed to create.
        # Move it aside for the restore and put it straight back.
        if [ ! -d vendor ] || [ -z "$(ls -A vendor 2>/dev/null)" ]; then
          mv .cargo/config.toml .cargo/config.toml.offline
          trap 'mv -f .cargo/config.toml.offline .cargo/config.toml 2>/dev/null || true' EXIT
          cargo vendor --locked --versioned-dirs --sync upstream/Cargo.toml > /dev/null
          mv -f .cargo/config.toml.offline .cargo/config.toml
          trap - EXIT
        fi
        test -f .cargo/config.toml

    - name: Build the IV5 static library
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        cd src/privacy_vnext/rust
        # Windows builds through MinGW, so target the GNU ABI explicitly and put
        # the archive where the makefile and the .pro expect to find it.
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          cargo build --locked --offline --release --target x86_64-pc-windows-gnu
          cargo build --locked --offline --target x86_64-pc-windows-gnu
          for p in release debug; do
            mkdir -p "target/$p"
            cp -f "target/x86_64-pc-windows-gnu/$p/libinnova_privacy_vnext.a" "target/$p/" 2>/dev/null || true
          done
        else
          cargo build --locked --offline --release
          cargo build --locked --offline
        fi

  # ─────────────────────────────────────────────────────────
  # Arch Linux x86_64 (daemon + Qt) via Docker
  # ─────────────────────────────────────────────────────────
  build-archlinux:
    runs-on: ubuntu-22.04
    needs: get-version
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5
        with:

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g stroke="#e6e8ec" stroke-width="2.4" stroke-linecap="round" fill="none">
    <!-- genesis branches -->
    <line x1="14" y1="32" x2="32" y2="15"/>
    <line x1="14" y1="32" x2="32" y2="49"/>
    <!-- forward edges -->
    <line x1="33" y1="15" x2="51" y2="24"/>
    <line x1="33" y1="49" x2="51" y2="46"/>
    <!-- CROSSING edges: each sink has two parents (the defining DAG trait) -->
    <line x1="33" y1="15" x2="51" y2="46" stroke-opacity="0.55"/>
    <line x1="33" y1="49" x2="51" y2="24" stroke-opacity="0.55"/>
  </g>
  <g fill="#e6e8ec" stroke="#14171c" stroke-width="1.3">
    <circle cx="13" cy="32" r="5.4"/>
    <circle cx="33" cy="14" r="5.4"/>
    <circle cx="33" cy="50" r="5.4"/>
    <circle cx="52" cy="23" r="5.4"/>
    <circle cx="52" cy="47" r="5.4"/>
  </g>
</svg>

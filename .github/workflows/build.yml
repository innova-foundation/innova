  # ─────────────────────────────────────────────────────────
  # Linux aarch64 Qt (daemon + Qt) via QEMU emulation
  # ─────────────────────────────────────────────────────────
  build-linux-arm64-qt:
    runs-on: ubuntu-22.04-arm
    needs: get-version
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0


      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust

      - name: Build daemon + Qt in an ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/build -w /build \
            debian:12 bash -c "
              apt-get update && \
              apt-get install -y build-essential libtool automake pkg-config \
                libssl-dev libevent-dev libboost-all-dev libdb++-dev \
                libminiupnpc-dev libqrencode-dev libcurl4-openssl-dev libgmp-dev \
                qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libgl1-mesa-dev \
                libprotobuf-dev protobuf-compiler git curl ca-certificates && \
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && \
              . \$HOME/.cargo/env && \
              cd src && \
              make USE_NATIVETOR=- USE_IPFS=- -f makefile.unix -j\$(nproc) && \
              cd .. && \
              sed -i 's/LIBS += -lcurl -lssl -lcrypto -lcrypt32 -lssh2 -lgcrypt -lidn2 -lgpg-error -lunistring -lwldap32 -ldb_cxx\$\$BDB_LIB_SUFFIX/LIBS += -lcurl -lssl -lcrypto -ldb_cxx\$\$BDB_LIB_SUFFIX/' innova-qt.pro && \
              (strip --remove-section=.note.ABI-tag /usr/lib/aarch64-linux-gnu/libQt5Core.so.5 || true) && \
              qmake6 USE_UPNP=1 USE_QRCODE=1 USE_NATIVETOR=- USE_IPFS=- innova-qt.pro && \
              make -j\$(nproc)
            "

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p innova-${{ needs.get-version.outputs.version }}-linux-aarch64-qt
          test -s src/innovad
          test -s Innova
          cp src/innovad innova-${{ needs.get-version.outputs.version }}-linux-aarch64-qt/
          cp Innova innova-${{ needs.get-version.outputs.version }}-linux-aarch64-qt/
          cd innova-${{ needs.get-version.outputs.version }}-linux-aarch64-qt
          sha256sum innovad Innova > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cd ..
          tar -czf innova-${{ needs.get-version.outputs.version }}-linux-aarch64-qt.tar.gz \
            innova-${{ needs.get-version.outputs.version }}-linux-aarch64-qt/
          test -s innova-${{ needs.get-version.outputs.version }}-linux-aarch64-qt.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: innova-linux-aarch64-qt
          path: innova-${{ needs.get-version.outputs.version }}-linux-aarch64-qt.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────
  # Required audit gates and GitHub release policy
  # ─────────────────────────────────────────────────────────
  # Required v5 release-audit gates. These build from clean objects so stale
  # test ABIs cannot turn proof-verifier results into false crashes or passes.
  audit-linux-clean:
    runs-on: ubuntu-22.04
    needs: get-version
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb++-dev \
            libminiupnpc-dev libcurl4-openssl-dev libgmp-dev libsecp256k1-dev

      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust

      - name: Static audit checks
        run: contrib/test/v5_release_gate.sh --static-checks

      - name: Clean warning-gated build and 38-translation-unit test aggregate
        run: |
          cd src
          make USE_NATIVETOR=- USE_IPFS=- -f makefile.unix clean
          make USE_NATIVETOR=- USE_IPFS=- -f makefile.unix -j$(nproc) innovad test_innova \
            CXXFLAGS="-Werror=return-type -Werror=format" \
            CFLAGS="-Werror=return-type -Werror=format"
          make USE_NATIVETOR=- USE_IPFS=- -f makefile.unix release-check \
            CXXFLAGS="-Werror=return-type -Werror=format" \
            CFLAGS="-Werror=return-type -Werror=format"

      - name: Materialize immutable source artifact
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse --verify HEAD)"
          [[ "$source_commit" =~ ^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$ ]]
          git cat-file -e "${source_commit}^{commit}"
          git archive --format=tar --prefix=innova-v5-source/ \
            --output="$RUNNER_TEMP/innova-v5-source.tar" "$source_commit"

      - uses: actions/upload-artifact@v6
        with:
          name: v5-immutable-source-artifact
          path: ${{ runner.temp }}/innova-v5-source.tar
          if-no-files-found: error
          retention-days: 30

  audit-linux-sanitizers:
    runs-on: ubuntu-22.04
    needs: get-version
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            libssl-dev libevent-dev bsdmainutils libboost-all-dev libdb++-dev \
            libminiupnpc-dev libcurl4-openssl-dev libgmp-dev libsecp256k1-dev

      - name: Setup IV5 Rust layer
        uses: ./.github/actions/setup-iv5-rust

      - name: Clean sanitizer build and 38-translation-unit test aggregate
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd src
          make USE_NATIVETOR=- USE_IPFS=- -f makefile.unix clean
          make USE_NATIVETOR=- USE_IPFS=- SANITIZE=${{ matrix.sanitizer }} \
            CXXFLAGS="-O1 -Werror=return-type -Werror=format" \
            CFLAGS="-O1 -Werror=return-type -Werror=format" \
            -f makefile.unix -j$(nproc) innovad test_innova
          ./test_innova \
            --run_test=bulletproof_ac_tests/range_proof_malformed_ipa_point_returns_false_without_crash \
            --catch_system_errors=yes
          ./test_innova \
            --run_test=bulletproof_ac_tests/nullstake_mofn_kernel_proof_create_verify \
            --catch_system_errors=yes
          make USE_NATIVETOR=- USE_IPFS=- SANITIZE=${{ matrix.sanitizer }} \
            CXXFLAGS="-O1 -Werror=return-type -Werror=format" \
            CFLAGS="-O1 -Werror=return-type -Werror=format" \
            -f makefile.unix release-check

  audit-rust-vnext:
    runs-on: ubuntu-22.04
    needs: get-version
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned Rust toolchain only
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy
      - name: Restore vendored crates
        working-directory: src/privacy_vnext/rust
        # vendor/ is not in history, and .cargo/config.toml pins the build offline
        # against it, so a fresh checkout cannot fetch anything: the gate that reads
        # vendor/ exits on the missing directory instead of comparing digests.
        # Re-fetch from crates.io at the locked versions -- verify_provenance.py then
        # checks what arrived against the recorded manifest, which is the tamper check.
        # --sync is required, not optional: the wrapper's own lock resolves 70 registry
        # crates while the gate compares against upstream's 158, so vendoring the
        # wrapper alone restores a set the check then calls inexact.
        run: |
          set -eu
          CARGO_NET_OFFLINE=false cargo vendor --locked --versioned-dirs \
            --sync upstream/Cargo.toml >/dev/null
          restored=$(find vendor -maxdepth 1 -mindepth 1 -type d | wc -l)
          expected=$(python3 -c 'import tomllib; print(sum(1 for p in tomllib.load(open("upstream/Cargo.lock","rb"))["package"] if p.get("checksum")))')
          echo "restored $restored vendored crates, upstream lock names $expected"
          test "$restored" -eq "$expected"
      - name: Verify vendored provenance and run locked offline Rust gate
        # Samples every 1024th byte; the full bit-flip sweep takes weeks on a runner.
        # Optimized test builds keep overflow checks and debug assertions; unoptimized
        # proving ran past the job limit.
        env:
          INNOVA_DIFF_STRIDE: "1024"
          CARGO_PROFILE_DEV_OPT_LEVEL: "3"
        run: src/privacy_vnext/rust/check.sh

  # Create GitHub Release (version tags or explicit manual publish)
  release:
    if: needs.get-version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    needs:
      - get-version
      - build-ubuntu-2204
      - build-ubuntu-2404
      - build-ubuntu-2604
      - build-debian-11
      - build-debian-12
      - build-fedora-40
      - build-fedora-41
      - build-archlinux
      - build-linux-arm64
      - build-linux-arm64-qt
      - build-macos-arm64
      - build-windows
      - audit-linux-clean
      - audit-linux-sanitizers
      - audit-rust-vnext
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-version.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Build vendored-crate archive for air-gapped reproduction
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          cd src/privacy_vnext/rust
          # Regenerate from the checksums pinned in Cargo.lock so the archive is
          # reproducible from the tag alone, then ship it with the release.
          CARGO_NET_OFFLINE=false cargo vendor --locked --versioned-dirs --sync upstream/Cargo.toml > /dev/null
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='UTC 2020-01-01' -cf - vendor | zstd -19 -T0 \
              -o "$GITHUB_WORKSPACE/innova-${{ needs.get-version.outputs.version }}-rust-vendor.tar.zst"
          cd "$GITHUB_WORKSPACE"
          sha256sum "innova-${{ needs.get-version.outputs.version }}-rust-vendor.tar.zst"

      - name: Collect release assets
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          expected=(
            "innova-${VERSION}-ubuntu2204-x86_64.tar.gz"
            "innova-${VERSION}-ubuntu2404-x86_64.tar.gz"
            "innova-${VERSION}-ubuntu2604-x86_64.tar.gz"
            "innova-${VERSION}-debian11-x86_64.tar.gz"
            "innova-${VERSION}-debian12-x86_64.tar.gz"
            "innova-${VERSION}-fedora40-x86_64.tar.gz"
            "innova-${VERSION}-fedora41-x86_64.tar.gz"
            "innova-${VERSION}-archlinux-x86_64.tar.gz"
            "innova-${VERSION}-linux-aarch64.tar.gz"
            "innova-${VERSION}-linux-aarch64-qt.tar.gz"
            "innova-${VERSION}-macOS-arm64.dmg"
            "innova-${VERSION}-win64.zip"
          )
          for asset in "${expected[@]}"; do
            case "$asset" in
              *)
                count="$(find artifacts -type f -name "$asset" | wc -l | tr -d '[:space:]')"
                if [ "$count" -ne 1 ]; then
                  echo "expected exactly one release asset $asset, found $count" >&2
                  exit 1
                fi
                source="$(find artifacts -type f -name "$asset" -print -quit)"
                ;;
            esac
            test -s "$source"
            cp "$source" release-assets/
          done
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" -eq 12
          sha256sum -- "${expected[@]}" > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          echo "=== Release Assets ==="
          ls -lh
          echo ""
          cat SHA256SUMS.txt

      - name: Delete existing release records
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ needs.get-version.outputs.version }}
          REPLACE_CONFIRM: ${{ inputs.replace_existing_release }}
        run: |
          set -euo pipefail
          release_ids="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id")"
          if [ -z "$release_ids" ]; then
            echo "No existing releases for ${TAG_NAME}"
            exit 0
          fi

          # An existing published release is destroyed only when the operator
          # typed the exact tag into replace_existing_release. Without that a
          # dispatch on any branch would silently delete the real release,
          # because the version comes from build.properties rather than the ref.
          if [ "$REPLACE_CONFIRM" != "$TAG_NAME" ]; then
            echo "Refusing to delete the existing ${TAG_NAME} release."
            echo "Re-run with replace_existing_release set to exactly ${TAG_NAME} if that is intended."
            exit 1
          fi

          for release_id in $release_ids; do
            echo "Deleting release ${release_id} for ${TAG_NAME}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done

      - name: Compose release notes
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -euo pipefail
          short="${VERSION%.*}"
          notes=""
          for f in "docs/release-notes-v${VERSION}.md" "docs/release-notes-v${short}.md"; do
            if [ -s "$f" ] && { [ "$f" = "docs/release-notes-v${VERSION}.md" ] || [ "${VERSION##*.}" = 0 ]; }; then notes="$f"; break; fi
          done
          {
            if [ -n "$notes" ]; then cat "$notes"; else
              prev="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -1)"
              echo "## Changes since ${prev}"
              git log --no-merges --format='- %s' "${prev}..HEAD" | grep -v '\[release:none\]' || true
            fi
            echo
            echo "## Checksums (SHA256SUMS.txt)"
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > release-body.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          target_commitish: ${{ needs.get-version.outputs.sha }}
          name: "Innova v${{ needs.get-version.outputs.version }}"
          body_path: release-body.md
          files: |
            release-assets/*
            innova-${{ needs.get-version.outputs.version }}-rust-vendor.tar.zst
          draft: false
          prerelease: false
          make_latest: true

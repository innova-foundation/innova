[advisories]
version = 2

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

yanked = "deny"

# Four TLS advisories against rustls and rustls-webpki. They are ignored here on
# one ground only: those crates are not in the archive this project ships.
# Verified against src/privacy_vnext/rust/target/release/libinnova_privacy_vnext.a
# -- zero rustls symbols, zero webpki symbols, zero object files out of 436. They
# enter the resolution through simple-request -> hyper-rustls, an HTTP client in
# the upstream workspace that nothing in the IV5 path calls.
#
# The audit deliberately covers a superset of what is linked (see
# contrib/test/produce_rust_audit_evidence.sh), so a crate that is resolved and
# never compiled reaches it. That is the case here.
#
# produce_rust_audit_evidence.sh fails if rustls or webpki ever appear in the
# archive, so this exemption stops holding the moment it stops being true rather
# than quietly outliving its reason.
ignore = [
    "RUSTSEC-2026-0098",  # webpki: name constraints for URI names accepted
    "RUSTSEC-2026-0099",  # webpki: name constraints accepted for a wildcard name
    "RUSTSEC-2026-0104",  # webpki: reachable panic parsing a revocation list
    "RUSTSEC-2026-0285",  # rustls: TLS 1.3 handshake across encryption levels
    # spin 0.10.0 is yanked upstream. Same ground: zero object files in the
    # archive. std-shims pulls it for its no_std path, which a std build does not
    # compile. yanked stays "deny" for everything else rather than being relaxed
    # globally to let this one through.
    { crate = "spin@0.10.0", reason = "not linked into libinnova_privacy_vnext.a; std-shims no_std path only" },
]

[licenses]
version = 2

# Commented licenses would be allowed but are not currently present
allow = [
  # Effective public domain
  # "CC0-1.0",
  "Unlicense",

  # Attribution required
  "MIT",
  # "MITNFA",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  # "Unicode-DFS-2016",
  "Unicode-3.0",
  # "OpenSSL",
  "CDLA-Permissive-2.0",

  # Non-invasive copyleft
  # "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # "GPL-3.0 WITH Classpath-exception-2.0",
]

exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = [
  # Contains a non-reproducible binary blob
  # https://github.com/serde-rs/serde/pull/2514
  # https://github.com/serde-rs/serde/issues/2575
  { name = "serde_derive", version = ">=1.0.172, <1.0.185" },
  # Introduced an insecure implementation of `borsh` removed with `0.15.1`
  # https://github.com/rust-lang/hashbrown/issues/576
  { name = "hashbrown", version = "=0.15.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
